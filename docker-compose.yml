services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/us_stock_agents
      RUN_INTERVAL_MINUTES: "30"
      MARKET_HOURS_ONLY: "false"
      PROFIT_TARGET_PCT: "5.0"
      MAX_DRAWDOWN_PCT: "10.0"
      INITIAL_CASH: "100000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: us_stock_agents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
