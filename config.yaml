# Broad US liquid universe is loaded from us_stock_agents.universe (100+ names).
# This watchlist is the always-on core; the scanner rotates the rest 24x7.
watchlist:
  - SPY
  - QQQ
  - IWM
  - AAPL
  - MSFT
  - NVDA
  - AMZN
  - GOOGL
  - META
  - TSLA
  - XOM
  - CVX
  - GLD
  - FCX
  - JPM
  - XLE
  - XLK

market:
  benchmark: SPY
  history_days: 120
  # How many rotating universe symbols to price each cycle
  scan_batch_size: 4
  # Max symbols after merge (impacted + held + batch) to backtest/trade
  trade_universe_limit: 4
  # Use full US_LIQUID_UNIVERSE scanner (true) or watchlist only (false)
  use_full_us_universe: true

scheduling:
  sentiment_lookback_hours: 24

reports:
  directory: reports

state:
  directory: state

paper_trading:
  initial_cash: 100000
  max_position_pct: 0.12
  commission_bps: 5

backtest:
  fast_ma: 10
  slow_ma: 30

news_feeds:
  - https://feeds.finance.yahoo.com/rss/2.0/headline?s=^GSPC&region=US&lang=en-US
  - https://www.investing.com/rss/news_25.rss
